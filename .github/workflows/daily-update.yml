name: Daily Investment Center Update

on:
  schedule:
    # 06:15 Asia/Hong_Kong = 22:15 UTC on the previous calendar day.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-center-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Update market data and Notion
        env:
          REQUIRE_NOTION: "true"
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_BATCH: ${{ secrets.NOTION_DB_BATCH }}
          NOTION_DB_MODULES: ${{ secrets.NOTION_DB_MODULES }}
          NOTION_DB_METRICS: ${{ secrets.NOTION_DB_METRICS }}
          NOTION_DB_INDUSTRY_TOP10: ${{ secrets.NOTION_DB_INDUSTRY_TOP10 }}
          NOTION_DB_EVENTS_TOP10: ${{ secrets.NOTION_DB_EVENTS_TOP10 }}
          NOTION_DB_HOLDINGS: ${{ secrets.NOTION_DB_HOLDINGS }}
        run: python scripts/cloud_daily_update.py

      - name: Validate industry discovery and dashboard payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/market-data.json").read_text(encoding="utf-8"))
          status = data.get("industryDiscoveryStatus", {})
          industries = data.get("industryWatch", [])
          allowed = {"全市场扫描完成", "休市/接口异常，沿用最近交易日"}
          assert status.get("status") in allowed, status
          if status.get("status") == "全市场扫描完成":
              board_count = int(status.get("boardCount", 0))
              dynamic_count = int(status.get("dynamicCandidateCount", 0))
              selected_count = int(status.get("selectedCount", 0))
              assert board_count >= 50, status
              assert dynamic_count >= 10, status
              assert selected_count == 10, status
              assert status.get("sourceDate") not in (None, "", "待核验"), status
          else:
              assert status.get("sourceDate") not in (None, "", "待核验"), status
          assert len(industries) == 10, len(industries)
          assert sum(item.get("tier") == "核心主线" for item in industries) == 5
          assert sum(item.get("tier") == "候补轮动" for item in industries) == 5
          for tier in ("核心主线", "候补轮动"):
              scores = [int(item.get("score", 0)) for item in industries if item.get("tier") == tier]
              assert scores == sorted(scores, reverse=True), (tier, scores)
          assert all(item.get("marketDate") for item in industries)
          assert all(item.get("reason") and item.get("refreshStatus") for item in industries)
          assert len({item.get("name") for item in industries}) == 10
          assert all(item.get("rankingMarket") == "A股" for item in industries)
          contract = data.get("v2", {})
          assert contract.get("contractVersion") == "dashboard-v2.0", contract
          assert contract.get("marketGate") in {"风险允许", "风险偏高", "停止新增", "数据不足"}, contract
          assert contract.get("dataHealth") in {"绿灯", "黄灯", "红灯", "灰灯"}, contract
          assert set(contract.get("moduleCoverage", {})) == {"0", "1", "2", "3", "4", "5", "7"}, contract
          radar = data.get("opportunityRadar", {})
          assert radar.get("businessDate") == contract.get("businessDate"), radar
          assert radar.get("executionStatus") == "灰灯", radar
          assert isinstance(radar.get("industries"), list), radar
          assert isinstance(radar.get("funds"), list), radar
          coded_radar = data.get("codedOpportunityRadar", {})
          assert coded_radar.get("businessDate") == contract.get("businessDate"), coded_radar
          assert coded_radar.get("executionEngineStatus") in {"未启用", "已启用"}, coded_radar
          coded_stocks = coded_radar.get("stocks", [])
          coded_etfs = coded_radar.get("etfs", [])
          assert len(coded_stocks) == 10 and len(coded_etfs) == 10, coded_radar
          assert all(isinstance(item.get("code"), str) and len(item["code"]) == 6 and item["code"].isdigit() for item in coded_stocks + coded_etfs), coded_radar
          stock_codes = {item["code"] for item in coded_stocks}
          etf_codes = {item["code"] for item in coded_etfs}
          assert len(stock_codes) == 10 and len(etf_codes) == 10, coded_radar
          for relation in coded_radar.get("relationships", []):
              assert set(relation.get("stockCodes", [])) <= stock_codes, relation
              assert relation.get("etfCode") in etf_codes, relation
          if coded_radar.get("executionEngineStatus") == "未启用":
              assert all(item.get("executionEligible") is False and item.get("executionAction") is None for item in coded_stocks + coded_etfs), coded_radar
          final_fund_codes = {
              "012733", "100055", "006751", "014344", "007818", "013180",
              "004432", "519704", "018125", "011103", "025856", "018896",
          }
          assert {str(item.get("code")) for item in data.get("fundHoldings", [])} == final_fund_codes
          assert len(data.get("financeNews", [])[:10]) == 10
          print("Industry discovery/fallback validation passed:", status)
          PY

      - name: Build B dashboard from audited data
        run: |
          python scripts/generate_dashboard_data.py
          npm ci --prefix dashboard --ignore-scripts
          npm run build --prefix dashboard
          python scripts/publish_dashboard_build.py

      - name: Validate published dashboard
        run: |
          test -s index.html
          test -d _next/static
          grep -q "每日综合大看板" index.html
          grep -q "投资研究中心 2.0" index.html

      - name: Commit and push if data changed
        run: |
          if git diff --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "investment-center-bot"
          git config user.email "actions@github.com"
          git add data/market-data.json dashboard/app/dashboard-data.ts index.html _next .nojekyll
          git commit -m "Update daily investment center dashboard"
          git push
